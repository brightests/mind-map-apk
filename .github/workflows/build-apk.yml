# 云端出包：本机不需要 Android Studio / SDK / gradle。
# 仓库根的 index.html + dist/ 是已提交的静态产物，CI 只需 Node + Capacitor + Gradle。
#
# 目标仓库：brightests/mind-map-apk（公开空仓库）；官方 wanglin2/mind-map 保留为 upstream。
# 公开仓库使用标准 GitHub-hosted runner 免费且不计分钟数；本 workflow 仅手动触发，按需构建。
name: Build Android APK

on:
  # 只用手动触发，按需出包，避免每次 push 都跑一遍 Gradle。
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Gradle task'
        required: true
        default: 'assembleDebug'
        type: choice
        options:
          - assembleDebug
          - assembleRelease
      publish_release:
        description: '同时发布到 Release（手机浏览器可直接下载）'
        required: false
        default: true
        type: boolean
  # 需要提交即构建时再放开：
  # push:
  #   branches: [feat/android-apk]

# 发布 Release 需要写权限；其余步骤只需要读取代码。
permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # 固定镜像：ubuntu-latest 在 2026-10-19 ~ 11-19 迁移到 26.04，
    # 默认 JDK 会变成 25 / Node 24，容易产生难以复现的构建差异。
    # ubuntu-24.04 镜像自带 ANDROID_HOME、android-34~36 平台、build-tools 34~37。
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apk/package-lock.json

      # Capacitor 8 的 @capacitor/android 用 Java 21 编译；镜像默认是 17。
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Preflight
        run: |
          for f in apk/package-lock.json apk/capacitor.config.json apk/scripts/build-www.mjs index.html dist/js/app.js; do
            if [ ! -f "$f" ]; then echo "::error::缺少文件 $f"; exit 1; fi
          done
          echo "preflight OK"

      - name: Install Capacitor deps
        working-directory: apk
        run: npm ci

      # 只复制已提交的静态产物；不重建 Vue2 应用（老栈 + 外部主题包有风险）。
      - name: Assemble web assets
        working-directory: apk
        run: npm run build:www

      # android/ 已入库；这里只做兜底，保证模板被误删时首次 CI 仍能出包。
      - name: Ensure Android platform
        working-directory: apk
        run: |
          if [ ! -f android/gradlew ]; then
            echo "android/ 未入库，自动生成模板"
            npx cap add android
          fi

      - name: Sync web assets into Android project
        working-directory: apk
        run: npx cap sync android

      - name: Build APK
        working-directory: apk/android
        run: |
          chmod +x ./gradlew
          # Windows 端 core.autocrlf=true 可能把 gradlew 变成 CRLF，
          # 在 Linux runner 上会报 bad interpreter；统一去掉行尾 \r。
          sed -i 's/\r$//' ./gradlew
          ./gradlew ${{ inputs.build_type || 'assembleDebug' }} --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mindmap-${{ inputs.build_type || 'assembleDebug' }}-${{ github.run_number }}
          path: apk/android/app/build/outputs/apk/**/*.apk
          retention-days: 14
          if-no-files-found: error

      # Artifact 下载需登录且 14 天后过期；公开 Release 附件免登录、长期有效，
      # 手机浏览器打开 Release 页面即可直接下载安装。
      - name: Publish APK to Release
        if: ${{ inputs.publish_release }}
        working-directory: apk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-${{ github.run_number }}"
          APK=$(find android/app/build/outputs/apk -name '*.apk' -type f | head -n 1)
          if [ -z "$APK" ]; then echo "::error::未找到 APK"; exit 1; fi
          gh release create "$TAG" "$APK" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "MindMap APK #${{ github.run_number }} (${{ inputs.build_type || 'assembleDebug' }})" \
            --notes "由 workflow_dispatch 手动触发的云端构建；未做正式签名，仅供自测安装。"

      # P6 发布签名：把 keystore 以 base64 存进 Secrets，用 -P 注入，
      # 不改 build.gradle，也不把密钥写入仓库。
      #   -Pandroid.injected.signing.store.file=...
      #   -Pandroid.injected.signing.store.password=...
      #   -Pandroid.injected.signing.key.alias=...
      #   -Pandroid.injected.signing.key.password=...
